<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>小屏手机数据库 | 紧凑型小尺寸智能手机筛选推荐工具</title>
  <meta name="description" content="专为小尺寸手机爱好者打造的数据库。收录2017年至今的全球紧凑型智能手机，秉承“小屏=小机身”理念，支持按长宽、重量等多维度精准筛选排序，支持离线使用。">
  <meta name="keywords" content="小屏手机,紧凑型手机,小尺寸手机,小屏手机数据库,小屏手机推荐,compact phones,コンパクトスマホ">
  <meta name="baidu-site-verification" content="codeva-iDT6TsBA68" />

  <link rel="canonical" href="https://phones.feeshy.top/">

  <meta property="og:title" content="小屏手机数据库 | 紧凑型小尺寸智能手机筛选推荐工具">
  <meta property="og:description" content="专为小尺寸手机爱好者打造的数据库。收录全球紧凑型智能手机，支持按长宽、重量多维度精准筛选。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://phones.feeshy.top/">
  <meta property="og:image" content="https://phones.feeshy.top/assets/og-image.png">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "小屏手机数据库",
    "alternateName": "Compact Phones Database",
    "url": "https://phones.feeshy.top/",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript. Requires HTML5.",
    "description": "A database and filtering tool for compact and small-sized smartphones released since 2017.",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "CNY"
    }
  }
  </script>
</head>

<body>
  <div class="header">
    <nav class="links" aria-label="Breadcrumb">
      <a href="https://feeshy.top">home</a>&gt;
      <a href="https://feeshy.top/lists">lists</a>&gt;
    </nav>
    <div class="title-section">
      <h1>小屏手机数据库</h1>
      <span class="date-badge">
        <span>更新: <time datetime="{{UPDATE_DATE}}">{{UPDATE_DATE}}</time></span>
        <span id="maxValueSlab"></span>
        <span id="maxValueFoldable"></span>
      </span>
    </div>

    <!-- 六个筛选项网格 -->
    <div class="filters-grid">
      <div class="filter-grid">
        <div class="filter-item">
          <label>年份</label>
          <div class="year-range">
            <input type="number" id="yearFrom" placeholder="起始" class="year-num">
            <span>-</span>
            <input type="number" id="yearTo" placeholder="结束" class="year-num">
          </div>
        </div>
        <div class="filter-item">
          <label>类型</label>
          <div class="type-switch-group" id="typeSwitchGroup">
            <button data-type="all" class="type-option">全部</button>
            <button data-type="直板" class="type-option">直板</button>
            <button data-type="折叠" class="type-option">折叠</button>
          </div>
        </div>
        <div class="filter-item">
          <label>宽度</label>
          <div class="num-input">≤<input type="number" id="widthMax" step="0.1" placeholder=""><span>mm</span></div>
        </div>
        <div class="filter-item">
          <label>厚度</label>
          <div class="num-input">≤<input type="number" id="thickMax" step="0.1" placeholder=""><span>mm</span></div>
        </div>
        <div class="filter-item">
          <label>重量</label>
          <div class="num-input">≤<input type="number" id="weightMax" step="1" placeholder=""><span>g</span></div>
        </div>
        <div class="filter-item">
          <label>电池</label>
          <div class="num-input">≥<input type="number" id="batteryMin" step="50" placeholder=""><span>mAh</span></div>
        </div>
        <div class="sort-group">
          <!-- 筛选 -->
          <button class="reset-btn" id="resetFilters">🔄</button>
          <span id="statsInfo"></span>
          <!-- 排序 -->
          <select id="sortField">
            <option value="model">机型</option>
            <option value="brand">品牌</option>
            <option value="screenRatio">比例</option>
            <option value="screenSize">尺寸</option>
            <option value="width" selected>宽度</option>
            <option value="thickness">厚度</option>
            <option value="weight">重量</option>
            <option value="battery">电池</option>
            <option value="soc">SoC</option>
            <option value="year">年份</option>
          </select>
          <button id="sortOrderBtn">⬆️</button>
        </div>
      </div>
    </div>

    <!-- 表格区域 -->
    <div class="table-wrapper">
      <table class="phone-table" id="phoneTable">
        <thead>
          <tr>
            <th data-field="model">机型</th>
            <th data-field="brand">品牌</th>
            <th data-field="screenRatio">主屏比例</th>
            <th data-field="screenSize">主屏尺寸</th>
            <th data-field="width">宽度</th>
            <th data-field="thickness">厚度</th>
            <th data-field="weight">重量</th>
            <th data-field="battery">电池</th>
            <th data-field="soc">SoC芯片</th>
            <th data-field="year">发布年份</th>
            <th data-field="remark">备注</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="11" class="loading">加载数据中...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 卡片容器 -->
    <div class="cards-view" id="cardsContainer"></div>

    <!-- 底部信息 -->
    <footer>
      <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vTxyzFWZtixYEqZMLHM_hwnSeSmFjIxIm27YWVMIMZjbfkbsfG6aPLR1fqAFuiyyW6K8znFPuAqVrOj/pubhtml" target="_blank" rel="noopener noreferrer">数据源</a> <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener noreferrer">(CC-BY-NC)</a>|
      <a href="https://forms.gle/51cjQH9zcqCK8aU56" target="_blank" rel="noopener">提名</a>|
      <a href="https://github.com/feeshy/compact-phones" target="_blank" rel="noopener noreferrer">源码</a> <a href="https://unlicense.org/" target="_blank" rel="noopener noreferrer">(Unlicense)</a>|
      <a href="https://t.me/compact_phones" target="_blank" rel="noopener">交流群</a>
    </footer>
  </div>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').then(reg => {
        console.log('Service Worker registered', reg);
      }).catch(err => console.log('SW registration failed', err));
    }
  </script>
</body>

</html>
